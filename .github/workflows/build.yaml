name: Build Flutter desktop app

# Reusable workflow: builds the app for all three desktop platforms.
# Called by ci.yml (compile check only) and release.yml (packages archives).

on:
  workflow_call:
    inputs:
      version:
        description: Version used in artifact names (e.g. the workflow run number)
        required: true
        type: string
      package_artifacts:
        description: Whether to package and upload release archives
        required: true
        type: boolean

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build (macOS, unsigned)
        if: matrix.platform == 'macos'
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: flutter build macos --release

      - name: Package (Linux)
        if: matrix.platform == 'linux' && inputs.package_artifacts
        run: |
          tar -C build/linux/x64/release/bundle -czf \
            shark_x3-${{ inputs.version }}-linux-x64.tar.gz .

      - name: Package (Windows)
        if: matrix.platform == 'windows' && inputs.package_artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath shark_x3-${{ inputs.version }}-windows-x64.zip

      - name: Package (macOS)
        if: matrix.platform == 'macos' && inputs.package_artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/shark_x3.app \
            shark_x3-${{ inputs.version }}-macos-arm64.zip

      - name: Upload artifacts
        if: inputs.package_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shark_x3-${{ matrix.platform }}
          path: shark_x3-${{ inputs.version }}-${{ matrix.platform }}-*
          if-no-files-found: error
