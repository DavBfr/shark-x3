name: hid
description: USB HID
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  logging: ^1.1.0
  plugin_platform_interface: ^2.1.0
  web: ^1.1.1

dev_dependencies:
  ffigen:
  flutter_lints: ">=3.0.0"

ffigen:
  name: "Api"
  output: "lib/generated_bindings.dart"
  compiler-opts:
    - "-Wno-nullability-completeness"
  functions:
    rename:
      "hid_(.*)": "$1"
  headers:
    entry-points:
      - "webauthn.h"
    include-directives:
      - "webauthn.h"

flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
